<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">QuoteRivet estimate request intake</title>
  <desc id="description">A paper-style QuoteRivet request dossier connects intake details, an accountable estimator, site evidence, and a pending human quote-ready review.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#c9bfae" stroke-opacity=".28"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2b251c" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#f3eee4"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="74" cy="65" r="23" fill="#6f3518" stroke="#d8a883" stroke-width="3"/>
    <text x="74" y="73" fill="#fffaf0" font-family="Georgia, serif" font-size="23" font-weight="700" text-anchor="middle">Q</text>
    <text x="111" y="73" fill="#24231f" font-family="Georgia, serif" font-size="27" font-weight="700">QuoteRivet</text>
    <text x="1134" y="70" fill="#225d78" font-size="16" font-weight="700" text-anchor="end">ESTIMATE REQUEST INTAKE</text>

    <text x="66" y="150" fill="#6f3518" font-family="monospace" font-size="15" font-weight="700" letter-spacing="2">ONE REQUEST. ONE ACCOUNTABLE NEXT STEP.</text>
    <text x="66" y="226" fill="#46556a" font-family="Georgia, serif" font-size="49" letter-spacing="-2">Turn scattered requests</text>
    <text x="66" y="282" fill="#46556a" font-family="Georgia, serif" font-size="49" letter-spacing="-2">into one owned path.</text>
    <text x="66" y="333" fill="#4c4942" font-size="18">Keep the source, site evidence, and accountable estimator</text>
    <text x="66" y="361" fill="#4c4942" font-size="18">connected before the quote-ready review.</text>

    <g filter="url(#shadow)">
      <rect x="650" y="133" width="485" height="423" fill="#fffaf0" stroke="#c9bfae"/>
      <rect x="650" y="133" width="8" height="423" fill="#955029"/>
    </g>
    <text x="691" y="177" fill="#6f3518" font-family="monospace" font-size="13" font-weight="700" letter-spacing="1.6">ESTIMATE REQUEST SHEET</text>
    <text x="691" y="216" fill="#24231f" font-family="Georgia, serif" font-size="29" font-weight="700">Exterior repair estimate</text>
    <rect x="982" y="165" width="116" height="29" rx="15" fill="#fde4df" stroke="#a75248"/>
    <text x="1040" y="185" fill="#6b241e" font-size="11" font-weight="700" text-anchor="middle">IN REVIEW</text>

    <line x1="714" y1="262" x2="714" y2="406" stroke="#c9bfae" stroke-width="3"/>
    <circle cx="714" cy="266" r="12" fill="#955029"/>
    <text x="745" y="258" fill="#6f3518" font-family="monospace" font-size="11" font-weight="700">01  REQUEST CAPTURED</text>
    <text x="745" y="282" fill="#24231f" font-size="16" font-weight="700">Call, text, email, or web form</text>
    <circle cx="714" cy="335" r="12" fill="#955029"/>
    <text x="745" y="327" fill="#6f3518" font-family="monospace" font-size="11" font-weight="700">02  ESTIMATOR ACCOUNTABLE</text>
    <text x="745" y="351" fill="#24231f" font-size="16" font-weight="700">Visit window and owner recorded</text>
    <circle cx="714" cy="404" r="12" fill="#955029"/>
    <text x="745" y="396" fill="#6f3518" font-family="monospace" font-size="11" font-weight="700">03  SITE EVIDENCE CURRENT</text>
    <text x="745" y="420" fill="#24231f" font-size="16" font-weight="700">Photos, measurements, scope notes</text>

    <rect x="691" y="449" width="407" height="76" fill="#24231f"/>
    <text x="715" y="478" fill="#d8a883" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1">QUOTE-READY DECISION</text>
    <text x="715" y="507" fill="#fffaf0" font-family="Georgia, serif" font-size="23" font-weight="700">Pending human review</text>
    <path d="M1045 484l10 10 21-24" fill="none" stroke="#d8a883" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"/>

    <rect x="66" y="434" width="480" height="58" rx="29" fill="#24231f"/>
    <text x="92" y="469" fill="#fffaf0" font-size="15" font-weight="700" letter-spacing="1">WORKS BESIDE ACCOUNTING + DISPATCH</text>
    <text x="66" y="546" fill="#625f58" font-size="15">Focused coordination for small residential service teams.</text>
  </g>
</svg>

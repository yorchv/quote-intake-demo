<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title description">
  <title id="title">QuoteRivet estimate request workflow</title>
  <desc id="description">A vertical paper-style QuoteRivet request dossier moves from multichannel intake to an accountable estimator, current site evidence, and a pending human quote-ready review.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#c9bfae" stroke-opacity=".28"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#2b251c" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1080" height="1920" fill="#f3eee4"/>
  <rect width="1080" height="1920" fill="url(#grid)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="92" cy="96" r="30" fill="#6f3518" stroke="#d8a883" stroke-width="4"/>
    <text x="92" y="106" fill="#fffaf0" font-family="Georgia, serif" font-size="30" font-weight="700" text-anchor="middle">Q</text>
    <text x="139" y="107" fill="#24231f" font-family="Georgia, serif" font-size="39" font-weight="700">QuoteRivet</text>
    <text x="986" y="102" fill="#225d78" font-size="17" font-weight="700" text-anchor="end">ESTIMATE REQUEST INTAKE</text>

    <text x="74" y="236" fill="#6f3518" font-family="monospace" font-size="19" font-weight="700" letter-spacing="2">ONE REQUEST. ONE ACCOUNTABLE NEXT STEP.</text>
    <text x="74" y="358" fill="#46556a" font-family="Georgia, serif" font-size="89" letter-spacing="-3">Turn scattered</text>
    <text x="74" y="453" fill="#46556a" font-family="Georgia, serif" font-size="89" letter-spacing="-3">requests into a</text>
    <text x="74" y="548" fill="#46556a" font-family="Georgia, serif" font-size="89" letter-spacing="-3">visible, owned path.</text>
    <text x="78" y="620" fill="#4c4942" font-size="29">From first contact to a documented</text>
    <text x="78" y="662" fill="#4c4942" font-size="29">quote-ready decision.</text>

    <g filter="url(#shadow)">
      <rect x="70" y="760" width="940" height="890" fill="#fffaf0" stroke="#c9bfae"/>
      <rect x="70" y="760" width="12" height="890" fill="#955029"/>
    </g>
    <text x="128" y="830" fill="#6f3518" font-family="monospace" font-size="17" font-weight="700" letter-spacing="2">ESTIMATE REQUEST SHEET</text>
    <text x="128" y="895" fill="#24231f" font-family="Georgia, serif" font-size="46" font-weight="700">Exterior repair estimate</text>
    <rect x="762" y="808" width="178" height="48" rx="24" fill="#fde4df" stroke="#a75248"/>
    <text x="851" y="840" fill="#6b241e" font-size="16" font-weight="700" text-anchor="middle">IN REVIEW</text>

    <line x1="174" y1="1010" x2="174" y2="1400" stroke="#c9bfae" stroke-width="5"/>
    <circle cx="174" cy="1016" r="21" fill="#955029"/>
    <text x="224" y="1003" fill="#6f3518" font-family="monospace" font-size="16" font-weight="700">01  REQUEST CAPTURED</text>
    <text x="224" y="1043" fill="#24231f" font-size="25" font-weight="700">Call, text, email, or web form</text>
    <circle cx="174" cy="1146" r="21" fill="#955029"/>
    <text x="224" y="1133" fill="#6f3518" font-family="monospace" font-size="16" font-weight="700">02  QUALIFIED + ASSIGNED</text>
    <text x="224" y="1173" fill="#24231f" font-size="25" font-weight="700">Fit checked, estimator accountable</text>
    <circle cx="174" cy="1276" r="21" fill="#955029"/>
    <text x="224" y="1263" fill="#6f3518" font-family="monospace" font-size="16" font-weight="700">03  SITE EVIDENCE CURRENT</text>
    <text x="224" y="1303" fill="#24231f" font-size="25" font-weight="700">Photos, measurements, scope notes</text>
    <circle cx="174" cy="1406" r="21" fill="#955029"/>
    <text x="224" y="1393" fill="#6f3518" font-family="monospace" font-size="16" font-weight="700">04  PACKAGE CHECKED</text>
    <text x="224" y="1433" fill="#24231f" font-size="25" font-weight="700">Open questions stay visible</text>

    <rect x="126" y="1490" width="828" height="112" fill="#24231f"/>
    <text x="164" y="1533" fill="#d8a883" font-family="monospace" font-size="15" font-weight="700" letter-spacing="1.5">QUOTE-READY DECISION</text>
    <text x="164" y="1574" fill="#fffaf0" font-family="Georgia, serif" font-size="34" font-weight="700">Pending human review</text>
    <path d="M874 1541l12 12 26-30" fill="none" stroke="#d8a883" stroke-linecap="round" stroke-linejoin="round" stroke-width="7"/>

    <rect x="74" y="1760" width="760" height="70" rx="35" fill="#24231f"/>
    <text x="116" y="1803" fill="#fffaf0" font-size="20" font-weight="700" letter-spacing="1">WORKS BESIDE ACCOUNTING + DISPATCH</text>
  </g>
</svg>
